<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b21b6">
  <title>CBT Asesmen Sumatif Matematika • Fase D</title>
  <style>
    :root {
      color-scheme: light;
      --purple: #6d28d9;
      --purple-strong: #5b21b6;
      --purple-deep: #3b0764;
      --purple-pale: #f5f3ff;
      --purple-border: #ddd6fe;
      --ink: #1e1731;
      --muted: #736a83;
      --line: #e9e5f0;
      --page: #f8f7fc;
      --white: #ffffff;
      --success: #16805d;
      --success-pale: #e9f8f1;
      --warn: #a3610b;
      --warn-pale: #fff6df;
      --danger: #b42332;
      --shadow: 0 14px 35px rgba(55, 33, 97, .075);
      --radius: 19px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 15px; line-height: 1.55; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    [hidden] { display: none !important; }
    .wrap { width: min(1200px, calc(100% - 44px)); margin: 0 auto; }
    .nav { height: 73px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .nav-shell { background: var(--white); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { width: 39px; height: 39px; border-radius: 13px; background: linear-gradient(150deg, #8b5cf6, #4c1d95); color: white; font-size: 20px; display: grid; place-items: center; flex: 0 0 auto; font-weight: 800; }
    .brand-title { font-weight: 820; font-size: 15px; line-height: 1.1; }
    .brand-small { color: var(--muted); font-size: 11px; line-height: 1.4; margin-top: 3px; }
    .pill { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 6px 11px; gap: 6px; font-size: 11px; font-weight: 750; background: var(--purple-pale); color: var(--purple-strong); white-space: nowrap; }
    .pill.gray { background: #f2f1f5; color: #5e576b; }
    .pill.orange { background: var(--warn-pale); color: var(--warn); }
    .pill.green { background: var(--success-pale); color: var(--success); }
    .button { appearance: none; border: 1px solid transparent; background: var(--purple); color: white; border-radius: 12px; font-weight: 770; padding: 12px 18px; min-height: 46px; display: inline-flex; justify-content: center; align-items: center; gap: 9px; transition: transform .1s ease, background .15s ease, box-shadow .15s ease; text-align: center; }
    .button:hover:not(:disabled) { background: var(--purple-strong); box-shadow: 0 5px 13px rgba(109,40,217,.17); }
    .button:active:not(:disabled) { transform: translateY(1px); }
    .button.secondary { color: var(--purple-strong); background: white; border: 1px solid var(--purple-border); }
    .button.secondary:hover:not(:disabled) { background: var(--purple-pale); box-shadow: none; }
    .button.ghost { color: var(--ink); background: white; border: 1px solid var(--line); }
    .button.ghost:hover:not(:disabled) { background: #f7f5fb; box-shadow: none; }
    .button.soft-red { color: var(--danger); background: #fff5f6; border-color: #ffd9df; }
    .button.soft-red:hover:not(:disabled) { background: #ffe7ea; box-shadow: none; }
    .button.sm { padding: 9px 12px; min-height: 36px; font-size: 12px; border-radius: 10px; }
    .button.full { width: 100%; }
    .landing { display: grid; grid-template-columns: 1.04fr .96fr; gap: 38px; align-items: stretch; padding-top: 60px; padding-bottom: 40px; }
    .hero { position: relative; overflow: hidden; min-height: 530px; color: white; background: radial-gradient(circle at 95% 2%, #a78bfa 0, transparent 33%), linear-gradient(142deg, #4c1d95 0%, #6425bb 58%, #7c3aed 100%); border-radius: 26px; padding: 45px 43px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); }
    .hero::before { content: ''; width: 280px; height: 280px; position: absolute; right: -100px; bottom: -110px; border-radius: 50%; border: 42px solid rgba(255,255,255,.12); }
    .hero::after { content: ''; position: absolute; width: 120px; height: 120px; border: 1px solid rgba(255,255,255,.3); transform: rotate(36deg); right: 54px; top: 140px; border-radius: 24px; }
    .hero > * { z-index: 1; position: relative; }
    .hero-label { text-transform: uppercase; letter-spacing: 1.6px; font-size: 11px; font-weight: 850; opacity: .81; }
    .hero h1 { font-size: clamp(34px, 4vw, 51px); line-height: 1.1; letter-spacing: -1.9px; margin: 18px 0 16px; max-width: 420px; }
    .hero p { color: #ebe4fc; max-width: 380px; line-height: 1.8; font-size: 14px; }
    .hero-footer { display: flex; gap: 9px; flex-wrap: wrap; }
    .hero-stat { min-width: 108px; border-radius: 12px; background: rgba(255,255,255,.11); border: 1px solid rgba(255,255,255,.18); padding: 11px 15px; }
    .hero-stat b { font-size: 21px; display: block; }
    .hero-stat span { color: #ece3ff; font-size: 11px; }
    .card { border: 1px solid var(--line); background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); }
    .login-card { padding: 39px 34px; display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { text-transform: uppercase; font-size: 11px; letter-spacing: 1.3px; font-weight: 850; color: var(--purple); }
    h2 { font-size: 27px; line-height: 1.25; margin: 7px 0 8px; letter-spacing: -.6px; }
    .sub { font-size: 13px; color: var(--muted); margin: 0 0 22px; }
    .field { margin: 0 0 17px; }
    .field label { display: block; font-size: 12px; font-weight: 750; margin: 0 0 7px; }
    .field input, .field select { display: block; width: 100%; padding: 12px 13px; min-height: 46px; background: white; color: var(--ink); border: 1px solid #ddd8e7; border-radius: 11px; outline: none; }
    .field input:focus, .field select:focus { border-color: #a78bfa; box-shadow: 0 0 0 3px rgba(167,139,250,.16); }
    .help { color: var(--muted); font-size: 11px; margin: 10px 0 0; }
    .notice { color: #68409b; background: var(--purple-pale); border: 1px solid var(--purple-border); border-radius: 11px; padding: 12px 14px; font-size: 12px; margin: 7px 0 20px; }
    .notice.danger { color: var(--danger); border-color: #ffcdd5; background: #fff2f4; }
    .loading { min-height: 58vh; display: grid; place-items: center; text-align: center; color: var(--muted); }
    .spinner { width: 27px; height: 27px; border-radius: 50%; border: 3px solid #ddd6fe; border-top-color: #6d28d9; animation: spin .7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .exam-layout { padding-top: 28px; padding-bottom: 30px; display: grid; grid-template-columns: minmax(0, 1fr) 303px; gap: 22px; align-items: start; }
    .exam-main { min-width: 0; }
    .exam-banner { padding: 18px 21px; display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 20px; }
    .exam-name { font-size: 16px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
    .exam-meta { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .timer { text-align: right; min-width: 102px; }
    .timer-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 750; }
    .timer-digits { color: var(--purple-strong); font-size: 24px; font-variant-numeric: tabular-nums; font-weight: 850; line-height: 1.3; letter-spacing: -.6px; }
    .timer.danger .timer-digits { color: var(--danger); }
    .progress-track { width: 100%; height: 6px; border-radius: 99px; background: #ebe6f4; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #a78bfa, #6d28d9); transition: width .2s; }
    .question-card { padding: 28px 30px 25px; min-height: 450px; }
    .q-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    .q-title { font-size: 13px; font-weight: 850; }
    .q-chip { color: var(--purple-strong); background: var(--purple-pale); padding: 5px 9px; border-radius: 7px; font-size: 11px; font-weight: 750; }
    .q-text { font-size: clamp(16px, 1.8vw, 19px); font-weight: 640; line-height: 1.8; margin: 24px 0 23px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .option-grid { display: grid; gap: 11px; }
    .option { border: 1.5px solid #e3deea; border-radius: 13px; background: white; padding: 13px 15px; width: 100%; text-align: left; display: flex; align-items: flex-start; gap: 14px; min-height: 62px; color: var(--ink); }
    .option:hover:not(:disabled) { border-color: #ac92eb; background: #faf8ff; }
    .option.selected { border-color: var(--purple); background: var(--purple-pale); box-shadow: inset 0 0 0 1px var(--purple); }
    .option-key { flex: 0 0 auto; height: 31px; width: 31px; display: grid; place-items: center; background: #f3f1f7; color: #6a6178; border-radius: 8px; font-weight: 820; font-size: 13px; }
    .option.selected .option-key { color: white; background: var(--purple); }
    .option-text { padding-top: 3px; overflow-wrap: anywhere; flex: 1; }
    .question-footer { border-top: 1px solid var(--line); padding-top: 19px; margin-top: 25px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .group-buttons { display: flex; gap: 9px; }
    .sidebar { padding: 22px; position: sticky; top: 20px; }
    .aside-title { font-size: 15px; font-weight: 850; margin: 0; }
    .aside-subtitle { font-size: 11px; color: var(--muted); margin: 4px 0 16px; }
    .aside-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 17px; }
    .mini-stat { background: #f7f5fa; padding: 9px 4px; text-align: center; border-radius: 10px; }
    .mini-stat b { display: block; font-size: 17px; line-height: 1.3; }
    .mini-stat span { font-size: 10px; color: var(--muted); }
    .number-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 8px; }
    .number { position: relative; width: 100%; height: 38px; border: 1px solid #ded8e9; background: #faf9fc; border-radius: 9px; font-weight: 740; color: #5e566e; font-size: 12px; }
    .number.answered { color: var(--success); background: #eaf8f1; border-color: #a9e4cd; }
    .number.flagged { color: var(--warn); background: var(--warn-pale); border-color: #edcf90; }
    .number.active { color: #fff; background: var(--purple); border-color: var(--purple); box-shadow: 0 0 0 3px rgba(109,40,217,.13); }
    .number.flagged::after { content: ''; width: 6px; height: 6px; border-radius: 50%; position: absolute; right: 3px; top: 3px; background: #eea21c; }
    .number.active.flagged::after { background: #ffd966; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; font-size: 10px; color: var(--muted); padding: 17px 0 15px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 3px; vertical-align: middle; }
    .dot.answered { background: #4ca987; }
    .dot.flagged { background: #e7ab34; }
    .dot.blank { background: #c9c4d1; }
    .save-label { color: var(--muted); text-align: center; font-size: 11px; margin: 11px 0 0; min-height: 18px; }
    .save-label.error { color: var(--danger); }
    .modal { position: fixed; inset: 0; padding: 22px; z-index: 30; display: grid; place-items: center; background: rgba(22, 16, 42, .59); }
    .modal-box { width: min(440px, 100%); background: white; border-radius: 20px; padding: 30px; box-shadow: 0 25px 80px rgba(0,0,0,.3); }
    .modal-box h3 { margin: 0 0 9px; font-size: 23px; }
    .modal-box p { color: var(--muted); font-size: 13px; line-height: 1.8; }
    .modal-actions { display: flex; justify-content: end; gap: 9px; margin-top: 23px; }
    .result { padding-top: 40px; padding-bottom: 48px; max-width: 960px; }
    .result-intro { text-align: center; margin: 8px 0 24px; }
    .checkmark { display: grid; place-items: center; width: 56px; height: 56px; background: #dcfce7; color: #15803d; border-radius: 50%; font-size: 29px; font-weight: 820; margin: 0 auto 16px; }
    .result-intro h1 { font-size: 28px; margin: 0 0 5px; }
    .result-intro p { color: var(--muted); font-size: 13px; }
    .result-card { padding: 24px; }
    .score-layout { display: grid; grid-template-columns: 200px 1fr; gap: 25px; align-items: center; }
    .score-circle { width: 170px; height: 170px; background: conic-gradient(var(--purple) var(--score), #ece8f5 0); border-radius: 50%; padding: 12px; margin: 0 auto; }
    .score-inner { height: 100%; width: 100%; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .score-inner strong { font-size: 42px; line-height: 1; color: var(--purple-strong); letter-spacing: -1px; }
    .score-inner span { font-size: 10px; color: var(--muted); margin-top: 6px; }
    .result-name { font-weight: 850; font-size: 21px; }
    .result-meta { font-size: 12px; color: var(--muted); }
    .score-metrics { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 17px; }
    .score-metric { padding: 9px 12px; background: #f7f5fa; border-radius: 9px; min-width: 93px; }
    .score-metric b { font-size: 18px; display: block; }
    .score-metric span { font-size: 10px; color: var(--muted); }
    .tp-panel { margin-top: 23px; padding: 25px; }
    .tp-list { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    .tp-list th { text-align: left; color: var(--muted); background: #f8f6fb; padding: 12px 10px; font-weight: 760; }
    .tp-list td { border-bottom: 1px solid var(--line); padding: 12px 10px; vertical-align: middle; }
    .tp-list tr:last-child td { border-bottom: none; }
    .tp-code { font-weight: 850; white-space: nowrap; }
    .tp-goal { font-size: 11px; color: var(--muted); max-width: 370px; }
    .result-footer { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .bottom-note { text-align: center; color: var(--muted); font-size: 11px; padding-bottom: 17px; }
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 45; padding: 12px 18px; border-radius: 12px; color: white; background: #2c2043; box-shadow: var(--shadow); font-size: 12px; max-width: calc(100% - 34px); }
    @media (max-width: 940px) {
      .landing { grid-template-columns: 1fr; gap: 18px; max-width: 680px; padding-top: 28px; }
      .hero { min-height: 270px; padding: 30px; }
      .hero h1 { font-size: 36px; margin: 10px 0; }
      .hero p { margin-bottom: 22px; }
      .exam-layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .number-grid { grid-template-columns: repeat(10,minmax(0,1fr)); }
    }
    @media (max-width: 600px) {
      .wrap { width: calc(100% - 24px); }
      .nav { height: 64px; }
      .brand-title { font-size: 13px; }
      .hero { padding: 24px; min-height: 245px; }
      .hero h1 { font-size: 32px; }
      .hero-stat { min-width: 85px; padding: 8px 11px; }
      .hero-stat b { font-size: 18px; }
      .login-card { padding: 25px 20px; }
      h2 { font-size: 24px; }
      .exam-layout { gap: 13px; padding-top: 13px; }
      .exam-banner { padding: 15px; margin-bottom: 12px; }
      .timer-digits { font-size: 22px; }
      .question-card { padding: 19px 16px; min-height: 350px; }
      .q-text { margin: 19px 0; font-size: 16px; }
      .option { padding: 11px; min-height: 56px; }
      .option-key { width: 28px; height: 28px; }
      .question-footer { gap: 11px; }
      .group-buttons { width: 100%; }
      .group-buttons .button { flex: 1; padding: 9px 8px; }
      .sidebar { padding: 17px; }
      .number-grid { grid-template-columns: repeat(7,minmax(0,1fr)); gap: 6px; }
      .number { height: 35px; }
      .result { padding-top: 20px; }
      .result-card, .tp-panel { padding: 17px; }
      .score-layout { grid-template-columns: 1fr; gap: 15px; text-align: center; }
      .score-circle { width: 145px; height: 145px; }

      .tp-list { font-size: 11px; }
      .tp-list th, .tp-list td { padding: 9px 5px; }
      .tp-goal { font-size: 10px; }
      .result-intro h1 { font-size: 24px; }
    }

    /* Peran pengguna: tombol masuk murid/guru dan ringkasan akun guru. */
    .role-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 21px; }
    .role-option { border: 1px solid var(--purple-border); color: var(--purple-strong); border-radius: 12px; background: white; min-height: 47px; font-size: 13px; font-weight: 800; }
    .role-option.active { color: white; background: var(--purple); border-color: var(--purple); }
    .role-option:not(.active):hover { background: var(--purple-pale); }
    .guru-dashboard { padding-top: 35px; padding-bottom: 35px; }
    .guru-heading { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom: 23px; }
    .guru-heading h2 { margin-bottom: 7px; }
    .guru-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:21px; }
    .guru-stat { display:flex; flex-direction:column; gap:6px; padding:22px; }
    .guru-stat span { font-size:12px; color:var(--muted); }
    .guru-stat strong { font-size:30px; color:var(--purple-strong); line-height:1.2; }
    .guru-table-card { padding:21px; }
    .guru-toolbar { display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:19px; }
    .guru-toolbar h3 { margin:0 0 4px; font-size:18px; }
    .guru-actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .guru-actions a { text-decoration:none; }
    .table-scroll { width:100%; overflow-x:auto; }
    .guru-table { width:100%; border-collapse:collapse; font-size:12px; white-space:nowrap; }
    .guru-table th { background:#f8f6fb; color:var(--muted); font-weight:800; text-align:left; padding:13px 12px; }
    .guru-table td { border-bottom:1px solid var(--line); padding:13px 12px; }
    .guru-table .empty-row { text-align:center; color:var(--muted); padding:26px; }
    @media (max-width: 700px) { .guru-stats { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width: 450px) { .guru-heading { align-items:flex-start; flex-direction:column; } .guru-stat { padding:16px; } .guru-stat strong { font-size:25px; } }
    @media print {
      .nav-shell, .result-footer, .bottom-note, .button { display: none !important; }
      body { background: white; }
      .result { width: 100%; margin: 0; }
      .card { box-shadow: none; border-color: #d5d5d5; }
      .tp-list tr { break-inside: avoid; }
    }

/* GitHub Pages mobile first improvements (rev 007) */
html, body { width: 100%; max-width: 100%; }
body { overflow-x: clip; -webkit-text-size-adjust: 100%; }
.wrap, .card, .exam-main, .guru-table-card, .landing > * { min-width: 0; }
.question-card, .option-text, .q-text, .hero, .guru-heading, .nav { overflow-wrap: anywhere; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.sidebar-scrim, .mobile-nav, .sidebar-close { display: none; }
.table-scroll { overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.guru-table-card { min-width: 0; }
.gurudata-scroll-tip { display: none; }
@media (max-width: 940px) {
  .exam-layout { padding-bottom: 106px; }
  .sidebar {
    position: fixed; z-index: 62; left: 0; right: 0; top: auto; bottom: 0;
    width: 100%; max-width: 100%; padding: 19px 17px calc(20px + env(safe-area-inset-bottom));
    max-height: min(84dvh, 760px); overflow: auto; border-radius: 24px 24px 0 0;
    box-shadow: 0 -20px 75px rgba(32,15,60,.22);
    transform: translateY(110%); visibility: hidden;
    transition: transform .22s ease, visibility .22s;
  }
  .sidebar.is-open { transform: translateY(0); visibility: visible; }
  .sidebar-scrim { position: fixed; inset: 0; z-index: 60; display: block;
    background: rgba(22,16,42,.57); border: 0; width: 100%; height: 100%; }
  .sidebar-close { display: inline-flex; float: right; align-items: center; justify-content: center;
    min-height: 40px; padding: 7px 11px; border-radius: 9px;
    background: var(--purple-pale); border: 1px solid var(--purple-border);
    color: var(--purple-strong); font-size: 12px; font-weight: 750; }
  .number-grid { grid-template-columns: repeat(7,minmax(0,1fr)); }
  .number { min-width: 0; min-height: 43px; }
  .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 35;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background: rgba(255,255,255,.97); border-top: 1px solid var(--line);
    box-shadow: 0 -5px 25px rgba(47,21,80,.10); }
  .mobile-nav .button { min-height: 45px; }
  .mobile-nav-summary { font-size: 12px; color: var(--muted); min-width: 0; }
  .mobile-nav-summary b { color: var(--purple-strong); font-size: 16px; }
  body.cbt-nav-open { overflow: hidden; }
  .exam-banner { position: sticky; top: 0; z-index: 8; box-shadow: 0 5px 18px rgba(35,12,66,.07); }
}
@media (max-width: 600px) {
  .field input, .field select { font-size: 16px; min-height: 49px; }

function urlBackend() {
  const raw = GAS_WEB_APP_URL.trim();

  try { u = new URL(raw); } catch (_) {
    throw new Error('Frontend belum terhubung. Pengelola harus mengisi GAS_WEB_APP_URL di index.html.');

function pollGAS(url, id, batas) {
  return new Promise((resolve, reject) => {

    let selesai = false, percobaan = 0, timer = null, node = null;

      if (node) { node.remove(); node = null; }

    }

      if (selesai) return;

      if (selesai) return;
      if (Date.now() > batas) {
        berhenti(new Error('Server terlalu lama merespons. Periksa jaringan lalu coba lagi.'));
        return;
      }

      window[callback] = function(res) {
        diterima = true;
        if (!res || res.status === 'pending') {
          rapikan(); timer = setTimeout(cek, Math.min(2500, 950 + percobaan * 180));
          return;
        }

          berhenti(new Error('Balasan server tidak dikenal.'));
        } else if (res.ok) berhenti(null, res.result);

      node.async = true;
      node.src = url + '?cbt_poll=' + id + '&callback=' + callback + '&_=' + Date.now();

async function callServer(name, ...args) {

    cbt_bridge: '008', cbt_request_id: id,
    cbt_action: name, cbt_args: JSON.stringify(args)

  // Hasilnya diterima melalui polling JSONP dengan ID acak, bukan dibaca via fetch.
  // No password, token, or answers are passed via query parameters.
  try {
    await fetch(url, { method: 'POST', mode: 'no-cors', redirect: 'follow',
      credentials: 'omit', cache: 'no-store', body: body });
  } catch (_) {
    throw new Error('Tidak dapat mengirim data ke GAS. Periksa deployment, akses Anyone, dan internet.');
  }
  return pollGAS(url, id, Date.now() + 85000);
}

/** Baca metadata publik melalui JSONP (GET read-only, tanpa CORS). */
function ambilKonfigurasiAwal() {
  const url = urlBackend();
  const id = idPermintaan();
  const callback = '__cbt_pub_' + id;
  return new Promise((resolve, reject) => {
    let selesai = false;
    const node = document.createElement('script');
    const timeout = setTimeout(() => beres(new Error(
      'GAS tidak merespons. Pastikan deployment versi terbaru dan akses Web App = Anyone.'
    )), 16000);
    function beres(err, result) {
      if (selesai) return;
      selesai = true;
      clearTimeout(timeout);
      node.remove();
      delete window[callback];
      if (err) reject(err);
      else resolve(result);
    }
    window[callback] = data => {
      if (!data || !data.ok || data.bridge !== '008' || !data.result) {
        beres(new Error('Versi GAS belum sesuai. Pilih Deploy → Manage deployments → New version.'));

      }
      beres(null, data.result);
    };
    node.onerror = () => beres(new Error(
      'GAS belum dapat diakses publik. Di setelan deployment, pilih akses Anyone dan deploy versi baru.'
    ));
    node.src = url + '?cbt_public=' + id + '&callback=' + callback + '&_=' + Date.now();
    document.head.appendChild(node);
  });
}

      <div class="number-grid" id="numberGrid" style="margin-top:17px" aria-label="Pilih nomor soal"></div>
      <div class="legend"><span><i class="dot answered"></i>Terjawab</span>
        <span><i class="dot flagged"></i>Ragu-ragu</span><span><i class="dot blank"></i>Belum dijawab</span></div>
      <button class="button full" id="finishButton" type="button">Kumpulkan Jawaban</button>
      <p class="save-label" id="saveStatus" role="status" aria-live="polite">Jawaban disimpan otomatis</p>
    </aside>
  </div><button type="button" class="sidebar-scrim" id="sidebarScrim" aria-label="Tutup navigasi soal" hidden></button>
  <div class="mobile-nav" id="mobileExamNav"><span class="mobile-nav-summary"><b id="mobileAnsweredCount">0</b> / ${s.pertanyaan.length} terjawab</span>
    <button class="button" type="button" id="openQuestionNav" aria-expanded="false" aria-controls="examSidebar">☷ Nomor Soal</button></div>
  <div class="bottom-note">Gunakan pilihan A–D untuk setiap soal. Waktu ujian tetap berjalan saat halaman ditutup.</div>`;
  el('prevButton').addEventListener('click', () => gotoQuestion(state.current - 1));
  el('nextButton').addEventListener('click', () => gotoQuestion(state.current + 1));
  el('flagButton').addEventListener('click', toggleFlag);
  el('finishButton').addEventListener('click', openModal);
  el('openQuestionNav').addEventListener('click', openQuestionNav);
  el('closeQuestionNav').addEventListener('click', closeQuestionNav);
  el('sidebarScrim').addEventListener('click', closeQuestionNav);
  el('numberGrid').addEventListener('click', ev => {
    const item = ev.target.closest('[data-index]');
    if (item) { gotoQuestion(Number(item.dataset.index)); closeQuestionNav(); }
  });
  el('questionArea').addEventListener('click', ev => {
    const item = ev.target.closest('[data-choice]');
    if (item) selectAnswer(item.dataset.choice);
  });
  renderQuestion(); renderNumberGrid(); refreshCounters();
}
function openQuestionNav() {
  const panel = el('examSidebar');
  if (!panel || window.innerWidth > 940) return;
  panel.classList.add('is-open');
  el('sidebarScrim').hidden = false;
  el('openQuestionNav').setAttribute('aria-expanded','true');
  document.body.classList.add('cbt-nav-open');
  el('closeQuestionNav').focus();
}
function closeQuestionNav() {
  const panel = el('examSidebar');
  if (!panel) return;
  const open = panel.classList.contains('is-open');
  panel.classList.remove('is-open');
  const scrim = el('sidebarScrim'); if (scrim) scrim.hidden = true;
  document.body.classList.remove('cbt-nav-open');
  const button = el('openQuestionNav');
  if (button) { button.setAttribute('aria-expanded','false'); if (open) button.focus(); }
}
function renderQuestion() {
  if (!state.session) return;
  const q = state.session.pertanyaan[state.current];
  const ans = state.answers[q.id] || '';
  el('questionArea').innerHTML = `<div class="q-top"><div class="q-title">Soal ${q.nomor} <span style="color:var(--muted);font-weight:500">/ ${state.session.pertanyaan.length}</span></div>
    <span class="q-chip">${escapeHTML(q.tp)}</span></div>
    <p class="q-text">${escapeHTML(q.teks)}</p>
    <div class="option-grid" role="group" aria-label="Pilihan jawaban">
      ${q.opsi.map(o => `<button type="button" class="option${ans===o.huruf ? ' selected' : ''}" data-choice="${o.huruf}" aria-pressed="${ans===o.huruf}">
        <span class="option-key">${o.huruf}</span><span class="option-text">${escapeHTML(o.teks)}</span></button>`).join('')}
    </div>`;
  const flagged = !!state.flags[q.id];
  el('flagButton').textContent = flagged ? '✓ Hapus tanda ragu' : '⚑ Tandai ragu';
  el('flagButton').className = 'button sm ' + (flagged ? 'soft-red' : 'secondary');
  el('prevButton').disabled = state.current === 0;
  el('nextButton').disabled = state.current === state.session.pertanyaan.length-1;
}
function renderNumberGrid() {
  if (!state.session) return;
  el('numberGrid').innerHTML = state.session.pertanyaan.map((q, idx) => {
    const classes = ['number'];
    if (state.answers[q.id]) classes.push('answered');
    if (state.flags[q.id]) classes.push('flagged');
    if (idx === state.current) classes.push('active');
    return `<button type="button" data-index="${idx}" class="${classes.join(' ')}" aria-label="Soal ${idx+1}${state.answers[q.id] ? ', terjawab' : ', belum dijawab'}${state.flags[q.id] ? ', ditandai ragu' : ''}" ${idx===state.current ? 'aria-current="step"' : ''}>${idx+1}</button>`;
  }).join('');
}
function refreshCounters() {
  if (!state.session) return;
  const c = examCounts();
  el('countAnswered').textContent = c.answered;
  const m = el('mobileAnsweredCount'); if (m) m.textContent = c.answered;
  el('countBlank').textContent = c.blank;
  el('countFlagged').textContent = c.flagged;
  el('progressFill').style.width = (100 * c.answered / c.total) + '%';
}
function gotoQuestion(index) {
  if (!state.session || state.submitting || index < 0 || index >= state.session.pertanyaan.length) return;
  state.current = index; renderQuestion(); renderNumberGrid(); storageSet();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function selectAnswer(letter) {
  if (!state.session || state.submitting || !['A','B','C','D'].includes(letter)) return;
  const q = state.session.pertanyaan[state.current];
  state.answers[q.id] = letter;
  renderQuestion(); renderNumberGrid(); refreshCounters(); storageSet(); scheduleSave();
}
function toggleFlag() {
  if (!state.session || state.submitting) return;
  const q = state.session.pertanyaan[state.current];
  if (state.flags[q.id]) delete state.flags[q.id]; else state.flags[q.id] = true;
  renderQuestion(); renderNumberGrid(); refreshCounters(); storageSet();
}
function scheduleSave() {
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(() => saveProgress(), 4500);
  showSaveStatus('Perubahan belum dikirim...', false);
}
function showSaveStatus(text, error) {
  const e = el('saveStatus');
  if (e) { e.textContent = text; e.classList.toggle('error', !!error); }
}
async function saveProgress() {
  if (!state.session || state.submitting) return;
  clearTimeout(state.saveTimer);
  if (state.saving) { state.needSave = true; return; }
  state.saving = true;
  state.needSave = false;
  const snapshot = { ...state.answers };
  showSaveStatus('Menyimpan jawaban...', false);
  try {
    const r = await callServer('simpanProgres', state.token, snapshot);
    if (r.tipe === 'selesai') { showResult(r.hasil); return; }
    const changed = JSON.stringify(snapshot) !== JSON.stringify(state.answers);
    if (changed) state.needSave = true;
    showSaveStatus('✓ Jawaban tersimpan', false);
  } catch (e) {
    if (state.session) { state.needSave = true; showSaveStatus('Gagal menyimpan. Akan dicoba lagi.', true); }
  } finally {
    state.saving = false;
    if (state.needSave && state.session && !state.submitting) {
      state.needSave = false;
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(() => saveProgress(), 4000);
    }
  }
}
function updateTimer() {
  if (!state.session || state.submitting) return;
  const left = Math.max(0, new Date(state.session.deadline).getTime() - Date.now());
  const sec = Math.ceil(left / 1000);
  const hh = Math.floor(sec / 3600);
  const mm = Math.floor(sec % 3600 / 60);
  const ss = sec % 60;
  const digits = [hh,mm,ss].map(x => String(x).padStart(2,'0')).join(':');
  const e = el('timerDigits'); if (e) e.textContent = digits;
  const box = el('timerBox'); if (box) box.classList.toggle('danger', left <= 600000);
  if (left <= 0) finishExam(true);
}
function openModal() {
  if (!state.session || state.submitting) return;
  const c = examCounts();
  el('modalText').innerHTML = `Anda telah menjawab <b>${c.answered} dari ${c.total} soal</b>.
    ${c.blank ? `Masih ada <b>${c.blank} soal yang belum dijawab</b>.` : 'Semua soal sudah dijawab.'}
    <br><br>Setelah dikumpulkan, jawaban tidak dapat diubah lagi.`;
  modal.hidden = false;
  el('modalConfirm').focus();
}
function closeModal() { modal.hidden = true; }
async function finishExam(auto = false) {
  if (!state.session || state.submitting) return;
  closeModal(); state.submitting = true;
  clearTimeout(state.saveTimer);
  clearInterval(state.tick); clearInterval(state.periodic);
  const button = el('finishButton'); if (button) { button.disabled = true; button.textContent = 'Mengumpulkan jawaban...'; }
  showSaveStatus(auto ? 'Waktu habis. Jawaban sedang dikumpulkan...' : 'Mengirim jawaban ke server...', false);
  try {
    const r = await callServer('akhiriUjian', state.token, { ...state.answers });
    if (r.tipe !== 'selesai') throw new Error('Server belum menyelesaikan penilaian.');
    showResult(r.hasil);
  } catch (e) {
    state.submitting = false;
    if (button) { button.disabled = false; button.textContent = 'Coba Kumpulkan Lagi'; }
    showSaveStatus('Gagal mengumpulkan. Periksa internet dan coba lagi.', true);
    notify(e.message);
    // Timer boleh berakhir; server tetap menghentikan ujian sesuai batas waktu asli.
  }
}
function cleanup() {
  clearInterval(state.tick); clearInterval(state.periodic); clearTimeout(state.saveTimer);
  state.tick = null; state.periodic = null; state.saveTimer = null;
}
function localTime(value) {
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '-';
  return d.toLocaleString('id-ID', { day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit' });
}
function scoreFmt(number) {
  return Number(number || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
}
function showResult(result) {
  cleanup(); closeModal();
  state.session = null; state.submitting = false;
  storageClear(); state.token = ''; state.answers = {}; state.flags = {};
  const visible = result && typeof result.nilai === 'number';
  const name = escapeHTML(result.nama || 'Peserta');
  const meta = `Kelas ${escapeHTML(result.kelas || '-')}`;
  const scored = visible ? `<div class="card result-card"><div class="score-layout">
    <div class="score-circle" style="--score:${Math.max(0,Math.min(100,result.nilai))}%">
      <div class="score-inner"><strong>${scoreFmt(result.nilai)}</strong><span>Nilai akhir / 100</span></div>
    </div><div><div class="result-name">${name}</div><div class="result-meta">${meta}</div>
      <div style="margin-top:13px"><span class="pill ${result.remedial && result.remedial.length ? 'orange' : 'green'}">${escapeHTML(result.status)}</span></div>
      <div class="score-metrics"><div class="score-metric"><b>${result.benar}</b><span>Jawaban benar</span></div>
        <div class="score-metric"><b>${result.dijawab} / ${result.jumlahSoal}</b><span>Soal terjawab</span></div>
        <div class="score-metric"><b>${result.kktp}</b><span>KKTP per TP</span></div></div>
      <p class="help" style="margin-top:12px">Kategori nilai keseluruhan: ${escapeHTML(result.kategori)}.</p>
    </div></div></div>
    <section class="card tp-panel"><div class="eyebrow">Pencapaian kompetensi</div>
      <h2 style="font-size:21px;margin-bottom:5px">Hasil per Tujuan Pembelajaran</h2>
      <p class="sub" style="margin-bottom:14px">Setiap TP dinilai pada skala 0–100 berdasarkan bobot soal pada file sumber.</p>
      <table class="tp-list"><thead><tr><th>TP</th><th>Tujuan Pembelajaran</th><th>Nilai</th><th>Keterangan</th></tr></thead><tbody>
      ${(result.tps || []).map(t => `<tr><td class="tp-code">${escapeHTML(t.kode)}</td>
        <td class="tp-goal">${escapeHTML(t.tujuan)}</td>
        <td style="font-weight:850">${scoreFmt(t.nilai)}</td>
        <td><span class="pill ${t.tuntas ? 'green' : 'orange'}">${t.tuntas ? 'Tuntas' : 'Remedial'}</span></td></tr>`).join('')}
      </tbody></table>
      ${result.remedial && result.remedial.length ? `<div class="notice" style="margin:18px 0 0">
        <b>Perlu tindak lanjut:</b> ${escapeHTML(result.remedial.join(', '))}. Hubungi guru untuk remedial pada TP tersebut.</div>` :
        `<div class="notice" style="margin:18px 0 0">Semua Tujuan Pembelajaran mencapai nilai minimal ${result.kktp}.</div>`}
    </section>` : `<div class="card result-card" style="text-align:center;padding:35px">
      <div class="result-name">${name}</div><p class="result-meta">${meta}</p>
      <p>${escapeHTML(result.keterangan || 'Jawaban telah diterima dan dapat diperiksa oleh guru.')}</p>
    </div>`;
  app.innerHTML = `${nav()}<main class="wrap result"><div class="result-intro">
    <div class="checkmark">✓</div><h1>Jawaban berhasil dikumpulkan</h1>
    <p>Terima kasih telah mengikuti asesmen sumatif. Selesai: ${escapeHTML(localTime(result.selesai))}.</p>
  </div>${scored}<div class="result-footer"><button class="button secondary" id="printResult" type="button">Cetak / Simpan Hasil</button>
    <button class="button" id="backLogin" type="button">Kembali ke Awal</button></div></main>
    <div class="bottom-note">Nilai dan detail jawaban tercatat pada Google Spreadsheet guru.</div>`;
  window.scrollTo(0, 0);
  el('printResult').onclick = () => window.print();
  el('backLogin').onclick = () => loginPage();
}
async function boot() {
  try { state.public = await ambilKonfigurasiAwal(); }
  catch (e) { loginPage(e.message); return; }
  const guru = guruStorageGet();
  if (guru && guru.token) {
    state.guruToken = guru.token; state.guruName = guru.nama || 'guru'; state.role = 'guru';
    try { await bukaDashboardGuru(); return; }
    catch (e) { guruStorageClear(); state.guruToken = ''; state.guruName = ''; }
  }
  const old = storageGet();
  if (old && old.token) {
    try { useResponse(await callServer('ambilUjian', old.token)); return; }
    catch (e) { loginPage('Sesi sebelumnya tidak dapat dipulihkan: ' + e.message); return; }
  }
  loginPage();
}
el('modalCancel').addEventListener('click', closeModal);
el('modalConfirm').addEventListener('click', () => finishExam(false));
modal.addEventListener('click', ev => { if (ev.target === modal) closeModal(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !modal.hidden) { closeModal(); return; }
  if (ev.key === 'Escape' && el('examSidebar') && el('examSidebar').classList.contains('is-open')) { closeQuestionNav(); return; }
  if (!state.session || state.submitting || !modal.hidden) return;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement && document.activeElement.tagName) || '')) return;
  if (['1','2','3','4'].includes(ev.key)) {
    selectAnswer(['A','B','C','D'][Number(ev.key) - 1]);
  } else if (ev.key === 'ArrowLeft') {
    ev.preventDefault(); gotoQuestion(state.current - 1);
  } else if (ev.key === 'ArrowRight') {
    ev.preventDefault(); gotoQuestion(state.current + 1);
  } else if (ev.key.toLowerCase() === 'r') { toggleFlag(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && state.session) { storageSet(); saveProgress(); }
});
window.addEventListener('beforeunload', () => { if (state.session) storageSet(); });
boot();
</script>
</body>
</html>
