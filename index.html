<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">

  <meta name="theme-color" content="#5b21b6">
  <title>Asesmen Sumatif Matematika Kelas IX • Rima Fitriyani, M.Pd.</title>
  <style>
    :root {
      color-scheme: light;
      --purple: #6d28d9;
      --purple-strong: #5b21b6;
      --purple-deep: #3b0764;
      --purple-pale: #f5f3ff;
      --purple-border: #ddd6fe;
      --ink: #1e1731;
      --muted: #736a83;
      --line: #e9e5f0;
      --page: #f8f7fc;
      --white: #ffffff;
      --success: #16805d;
      --success-pale: #e9f8f1;
      --warn: #a3610b;
      --warn-pale: #fff6df;
      --danger: #b42332;
      --shadow: 0 14px 35px rgba(55, 33, 97, .075);
      --radius: 19px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 15px; line-height: 1.55; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    [hidden] { display: none !important; }
    .wrap { width: min(1200px, calc(100% - 44px)); margin: 0 auto; }
    .nav { height: 73px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .nav-shell { background: var(--white); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { width: 39px; height: 39px; border-radius: 13px; background: linear-gradient(150deg, #8b5cf6, #4c1d95); color: white; font-size: 20px; display: grid; place-items: center; flex: 0 0 auto; font-weight: 800; }
    .brand-title { font-weight: 820; font-size: 15px; line-height: 1.1; }
    .brand-small { color: var(--muted); font-size: 11px; line-height: 1.4; margin-top: 3px; }
    .pill { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 6px 11px; gap: 6px; font-size: 11px; font-weight: 750; background: var(--purple-pale); color: var(--purple-strong); white-space: nowrap; }
    .pill.gray { background: #f2f1f5; color: #5e576b; }
    .pill.orange { background: var(--warn-pale); color: var(--warn); }
    .pill.green { background: var(--success-pale); color: var(--success); }
    .button { appearance: none; border: 1px solid transparent; background: var(--purple); color: white; border-radius: 12px; font-weight: 770; padding: 12px 18px; min-height: 46px; display: inline-flex; justify-content: center; align-items: center; gap: 9px; transition: transform .1s ease, background .15s ease, box-shadow .15s ease; text-align: center; }
    .button:hover:not(:disabled) { background: var(--purple-strong); box-shadow: 0 5px 13px rgba(109,40,217,.17); }
    .button:active:not(:disabled) { transform: translateY(1px); }
    .button.secondary { color: var(--purple-strong); background: white; border: 1px solid var(--purple-border); }
    .button.secondary:hover:not(:disabled) { background: var(--purple-pale); box-shadow: none; }
    .button.ghost { color: var(--ink); background: white; border: 1px solid var(--line); }
    .button.ghost:hover:not(:disabled) { background: #f7f5fb; box-shadow: none; }
    .button.soft-red { color: var(--danger); background: #fff5f6; border-color: #ffd9df; }
    .button.soft-red:hover:not(:disabled) { background: #ffe7ea; box-shadow: none; }
    .button.sm { padding: 9px 12px; min-height: 36px; font-size: 12px; border-radius: 10px; }
    .button.full { width: 100%; }
    .landing { display: grid; grid-template-columns: 1.04fr .96fr; gap: 38px; align-items: stretch; padding-top: 60px; padding-bottom: 40px; }
    .hero { position: relative; overflow: hidden; min-height: 530px; color: white; background: radial-gradient(circle at 95% 2%, #a78bfa 0, transparent 33%), linear-gradient(142deg, #4c1d95 0%, #6425bb 58%, #7c3aed 100%); border-radius: 26px; padding: 45px 43px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); }
    .hero::before { content: ''; width: 280px; height: 280px; position: absolute; right: -100px; bottom: -110px; border-radius: 50%; border: 42px solid rgba(255,255,255,.12); }
    .hero::after { content: ''; position: absolute; width: 120px; height: 120px; border: 1px solid rgba(255,255,255,.3); transform: rotate(36deg); right: 54px; top: 140px; border-radius: 24px; }
    .hero > * { z-index: 1; position: relative; }
    .hero-label { text-transform: uppercase; letter-spacing: 1.6px; font-size: 11px; font-weight: 850; opacity: .81; }
    .hero h1 { font-size: clamp(34px, 4vw, 51px); line-height: 1.1; letter-spacing: -1.9px; margin: 18px 0 16px; max-width: 420px; }
    .hero p { color: #ebe4fc; max-width: 380px; line-height: 1.8; font-size: 14px; }
    .hero-footer { display: flex; gap: 9px; flex-wrap: wrap; }
    .hero-stat { min-width: 108px; border-radius: 12px; background: rgba(255,255,255,.11); border: 1px solid rgba(255,255,255,.18); padding: 11px 15px; }
    .hero-stat b { font-size: 21px; display: block; }
    .hero-stat span { color: #ece3ff; font-size: 11px; }
    .card { border: 1px solid var(--line); background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); }
    .login-card { padding: 39px 34px; display: flex; flex-direction: column; justify-content: center; }

    h2 { font-size: 27px; line-height: 1.25; margin: 7px 0 8px; letter-spacing: -.6px; }
    .sub { font-size: 13px; color: var(--muted); margin: 0 0 22px; }
    .field { margin: 0 0 17px; }
    .field label { display: block; font-size: 12px; font-weight: 750; margin: 0 0 7px; }
    .field input, .field select { display: block; width: 100%; padding: 12px 13px; min-height: 46px; background: white; color: var(--ink); border: 1px solid #ddd8e7; border-radius: 11px; outline: none; }
    .field input:focus, .field select:focus { border-color: #a78bfa; box-shadow: 0 0 0 3px rgba(167,139,250,.16); }
    .help { color: var(--muted); font-size: 11px; margin: 10px 0 0; }
    .notice { color: #68409b; background: var(--purple-pale); border: 1px solid var(--purple-border); border-radius: 11px; padding: 12px 14px; font-size: 12px; margin: 7px 0 20px; }
    .notice.danger { color: var(--danger); border-color: #ffcdd5; background: #fff2f4; }
    .loading { min-height: 58vh; display: grid; place-items: center; text-align: center; color: var(--muted); }
    .spinner { width: 27px; height: 27px; border-radius: 50%; border: 3px solid #ddd6fe; border-top-color: #6d28d9; animation: spin .7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .exam-layout { padding-top: 28px; padding-bottom: 30px; display: grid; grid-template-columns: minmax(0, 1fr) 303px; gap: 22px; align-items: start; }
    .exam-main { min-width: 0; }
    .exam-banner { padding: 18px 21px; display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 20px; }
    .exam-name { font-size: 16px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
    .exam-meta { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .timer { text-align: right; min-width: 102px; }
    .timer-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 750; }
    .timer-digits { color: var(--purple-strong); font-size: 24px; font-variant-numeric: tabular-nums; font-weight: 850; line-height: 1.3; letter-spacing: -.6px; }
    .timer.danger .timer-digits { color: var(--danger); }
    .progress-track { width: 100%; height: 6px; border-radius: 99px; background: #ebe6f4; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #a78bfa, #6d28d9); transition: width .2s; }
    .question-card { padding: 28px 30px 25px; min-height: 450px; }
    .q-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    .q-title { font-size: 13px; font-weight: 850; }
    .q-chip { color: var(--purple-strong); background: var(--purple-pale); padding: 5px 9px; border-radius: 7px; font-size: 11px; font-weight: 750; }
    .q-text { font-size: clamp(16px, 1.8vw, 19px); font-weight: 640; line-height: 1.8; margin: 24px 0 23px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .option-grid { display: grid; gap: 11px; }
    .option { border: 1.5px solid #e3deea; border-radius: 13px; background: white; padding: 13px 15px; width: 100%; text-align: left; display: flex; align-items: flex-start; gap: 14px; min-height: 62px; color: var(--ink); }
    .option:hover:not(:disabled) { border-color: #ac92eb; background: #faf8ff; }
    .option.selected { border-color: var(--purple); background: var(--purple-pale); box-shadow: inset 0 0 0 1px var(--purple); }
    .option-key { flex: 0 0 auto; height: 31px; width: 31px; display: grid; place-items: center; background: #f3f1f7; color: #6a6178; border-radius: 8px; font-weight: 820; font-size: 13px; }
    .option.selected .option-key { color: white; background: var(--purple); }
    .option-text { padding-top: 3px; overflow-wrap: anywhere; flex: 1; }
    .question-footer { border-top: 1px solid var(--line); padding-top: 19px; margin-top: 25px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .group-buttons { display: flex; gap: 9px; }
    .sidebar { padding: 22px; position: sticky; top: 20px; }
    .aside-title { font-size: 15px; font-weight: 850; margin: 0; }
    .aside-subtitle { font-size: 11px; color: var(--muted); margin: 4px 0 16px; }
    .aside-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 17px; }
    .mini-stat { background: #f7f5fa; padding: 9px 4px; text-align: center; border-radius: 10px; }
    .mini-stat b { display: block; font-size: 17px; line-height: 1.3; }
    .mini-stat span { font-size: 10px; color: var(--muted); }
    .number-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 8px; }
    .number { position: relative; width: 100%; height: 38px; border: 1px solid #ded8e9; background: #faf9fc; border-radius: 9px; font-weight: 740; color: #5e566e; font-size: 12px; }
    .number.answered { color: var(--success); background: #eaf8f1; border-color: #a9e4cd; }
    .number.flagged { color: var(--warn); background: var(--warn-pale); border-color: #edcf90; }
    .number.active { color: #fff; background: var(--purple); border-color: var(--purple); box-shadow: 0 0 0 3px rgba(109,40,217,.13); }
    .number.flagged::after { content: ''; width: 6px; height: 6px; border-radius: 50%; position: absolute; right: 3px; top: 3px; background: #eea21c; }
    .number.active.flagged::after { background: #ffd966; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; font-size: 10px; color: var(--muted); padding: 17px 0 15px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 3px; vertical-align: middle; }
    .dot.answered { background: #4ca987; }
    .dot.flagged { background: #e7ab34; }
    .dot.blank { background: #c9c4d1; }
    .save-label { color: var(--muted); text-align: center; font-size: 11px; margin: 11px 0 0; min-height: 18px; }
    .save-label.error { color: var(--danger); }
    .modal { position: fixed; inset: 0; padding: 22px; z-index: 30; display: grid; place-items: center; background: rgba(22, 16, 42, .59); }
    .modal-box { width: min(440px, 100%); background: white; border-radius: 20px; padding: 30px; box-shadow: 0 25px 80px rgba(0,0,0,.3); }
    .modal-box h3 { margin: 0 0 9px; font-size: 23px; }
    .modal-box p { color: var(--muted); font-size: 13px; line-height: 1.8; }
    .modal-actions { display: flex; justify-content: end; gap: 9px; margin-top: 23px; }
    .result { padding-top: 40px; padding-bottom: 48px; max-width: 960px; }
    .result-intro { text-align: center; margin: 8px 0 24px; }
    .checkmark { display: grid; place-items: center; width: 56px; height: 56px; background: #dcfce7; color: #15803d; border-radius: 50%; font-size: 29px; font-weight: 820; margin: 0 auto 16px; }
    .result-intro h1 { font-size: 28px; margin: 0 0 5px; }
    .result-intro p { color: var(--muted); font-size: 13px; }
    .result-card { padding: 24px; }
    .score-layout { display: grid; grid-template-columns: 200px 1fr; gap: 25px; align-items: center; }
    .score-circle { width: 170px; height: 170px; background: conic-gradient(var(--purple) var(--score), #ece8f5 0); border-radius: 50%; padding: 12px; margin: 0 auto; }
    .score-inner { height: 100%; width: 100%; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .score-inner strong { font-size: 42px; line-height: 1; color: var(--purple-strong); letter-spacing: -1px; }
    .score-inner span { font-size: 10px; color: var(--muted); margin-top: 6px; }
    .result-name { font-weight: 850; font-size: 21px; }
    .result-meta { font-size: 12px; color: var(--muted); }
    .score-metrics { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 17px; }
    .score-metric { padding: 9px 12px; background: #f7f5fa; border-radius: 9px; min-width: 93px; }
    .score-metric b { font-size: 18px; display: block; }
    .score-metric span { font-size: 10px; color: var(--muted); }
    .tp-panel { margin-top: 23px; padding: 25px; }
    .tp-list { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    .tp-list th { text-align: left; color: var(--muted); background: #f8f6fb; padding: 12px 10px; font-weight: 760; }
    .tp-list td { border-bottom: 1px solid var(--line); padding: 12px 10px; vertical-align: middle; }
    .tp-list tr:last-child td { border-bottom: none; }
    .tp-code { font-weight: 850; white-space: nowrap; }
    .tp-goal { font-size: 11px; color: var(--muted); max-width: 370px; }
    .result-footer { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .bottom-note { text-align: center; color: var(--muted); font-size: 11px; padding-bottom: 17px; }
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 45; padding: 12px 18px; border-radius: 12px; color: white; background: #2c2043; box-shadow: var(--shadow); font-size: 12px; max-width: calc(100% - 34px); }
    @media (max-width: 940px) {
      .landing { grid-template-columns: 1fr; gap: 18px; max-width: 680px; padding-top: 28px; }
      .hero { min-height: 270px; padding: 30px; }
      .hero h1 { font-size: 36px; margin: 10px 0; }
      .hero p { margin-bottom: 22px; }
      .exam-layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .number-grid { grid-template-columns: repeat(10,minmax(0,1fr)); }
    }
    @media (max-width: 600px) {
      .wrap { width: calc(100% - 24px); }
      .nav { height: 64px; }
      .brand-title { font-size: 13px; }
      .hero { padding: 24px; min-height: 245px; }
      .hero h1 { font-size: 32px; }
      .hero-stat { min-width: 85px; padding: 8px 11px; }
      .hero-stat b { font-size: 18px; }
      .login-card { padding: 25px 20px; }
      h2 { font-size: 24px; }
      .exam-layout { gap: 13px; padding-top: 13px; }
      .exam-banner { padding: 15px; margin-bottom: 12px; }
      .timer-digits { font-size: 22px; }
      .question-card { padding: 19px 16px; min-height: 350px; }
      .q-text { margin: 19px 0; font-size: 16px; }
      .option { padding: 11px; min-height: 56px; }
      .option-key { width: 28px; height: 28px; }
      .question-footer { gap: 11px; }
      .group-buttons { width: 100%; }
      .group-buttons .button { flex: 1; padding: 9px 8px; }
      .sidebar { padding: 17px; }
      .number-grid { grid-template-columns: repeat(7,minmax(0,1fr)); gap: 6px; }

      .result { padding-top: 20px; }

      .tp-list th, .tp-list td { padding: 9px 5px; }
      .tp-goal { font-size: 10px; }
      .result-intro h1 { font-size: 24px; }
    }

    /* Peran pengguna: tombol masuk murid/guru dan ringkasan akun guru. */
    .role-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 21px; }
    .role-option { border: 1px solid var(--purple-border); color: var(--purple-strong); border-radius: 12px; background: white; min-height: 47px; font-size: 13px; font-weight: 800; }
    .role-option.active { color: white; background: var(--purple); border-color: var(--purple); }
    .role-option:not(.active):hover { background: var(--purple-pale); }
    .guru-dashboard { padding-top: 35px; padding-bottom: 35px; }
    .guru-heading { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom: 23px; }
    .guru-heading h2 { margin-bottom: 7px; }
    .guru-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:21px; }
    .guru-stat { display:flex; flex-direction:column; gap:6px; padding:22px; }
    .guru-stat span { font-size:12px; color:var(--muted); }
    .guru-stat strong { font-size:30px; color:var(--purple-strong); line-height:1.2; }
    .guru-table-card { padding:21px; }
    .guru-toolbar { display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:19px; }
    .guru-toolbar h3 { margin:0 0 4px; font-size:18px; }
    .guru-actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .guru-actions a { text-decoration:none; }
    .table-scroll { width:100%; overflow-x:auto; }
    .guru-table { width:100%; border-collapse:collapse; font-size:12px; white-space:nowrap; }
    .guru-table th { background:#f8f6fb; color:var(--muted); font-weight:800; text-align:left; padding:13px 12px; }
    .guru-table td { border-bottom:1px solid var(--line); padding:13px 12px; }
    .guru-table .empty-row { text-align:center; color:var(--muted); padding:26px; }
    @media (max-width: 700px) { .guru-stats { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width: 450px) { .guru-heading { align-items:flex-start; flex-direction:column; } .guru-stat { padding:16px; } .guru-stat strong { font-size:25px; } }
    @media print {
      .nav-shell, .result-footer, .bottom-note, .button { display: none !important; }
      body { background: white; }
      .result { width: 100%; margin: 0; }
      .card { box-shadow: none; border-color: #d5d5d5; }
      .tp-list tr { break-inside: avoid; }
    }

/* GitHub Pages mobile first improvements (rev 007) */
html, body { width: 100%; max-width: 100%; }
body { overflow-x: clip; -webkit-text-size-adjust: 100%; }
.wrap, .card, .exam-main, .guru-table-card, .landing > * { min-width: 0; }
.question-card, .option-text, .q-text, .hero, .guru-heading, .nav { overflow-wrap: anywhere; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.sidebar-scrim, .mobile-nav, .sidebar-close { display: none; }
.table-scroll { overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.guru-table-card { min-width: 0; }
.gurudata-scroll-tip { display: none; }
@media (max-width: 940px) {
  .exam-layout { padding-bottom: 106px; }
  .sidebar {
    position: fixed; z-index: 62; left: 0; right: 0; top: auto; bottom: 0;
    width: 100%; max-width: 100%; padding: 19px 17px calc(20px + env(safe-area-inset-bottom));
    max-height: min(84dvh, 760px); overflow: auto; border-radius: 24px 24px 0 0;
    box-shadow: 0 -20px 75px rgba(32,15,60,.22);
    transform: translateY(110%); visibility: hidden;
    transition: transform .22s ease, visibility .22s;
  }
  .sidebar.is-open { transform: translateY(0); visibility: visible; }
  .sidebar-scrim { position: fixed; inset: 0; z-index: 60; display: block;
    background: rgba(22,16,42,.57); border: 0; width: 100%; height: 100%; }
  .sidebar-close { display: inline-flex; float: right; align-items: center; justify-content: center;
    min-height: 40px; padding: 7px 11px; border-radius: 9px;
    background: var(--purple-pale); border: 1px solid var(--purple-border);
    color: var(--purple-strong); font-size: 12px; font-weight: 750; }
  .number-grid { grid-template-columns: repeat(7,minmax(0,1fr)); }
  .number { min-width: 0; min-height: 43px; }
  .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 35;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background: rgba(255,255,255,.97); border-top: 1px solid var(--line);
    box-shadow: 0 -5px 25px rgba(47,21,80,.10); }
  .mobile-nav .button { min-height: 45px; }
  .mobile-nav-summary { font-size: 12px; color: var(--muted); min-width: 0; }
  .mobile-nav-summary b { color: var(--purple-strong); font-size: 16px; }
  body.cbt-nav-open { overflow: hidden; }
  .exam-banner { position: sticky; top: 0; z-index: 8; box-shadow: 0 5px 18px rgba(35,12,66,.07); }
}
@media (max-width: 600px) {

function pollGAS(url,id,timeoutMs){
 return new Promise((resolve,reject)=>{
  const cb='__cbt_res_'+id;let done=false,cycles=0,node=null,watcher=null,again=null;
  const total=setTimeout(()=>finish(new Error('GAS tidak memberikan jawaban. Pastikan deployment Revisi 010 memiliki akses Anyone, kemudian lihat Executions di GAS.')),timeoutMs);
  function clearNode(){clearTimeout(watcher);if(node){node.onerror=null;node.remove();node=null;}delete window[cb];}
  function finish(err,value){if(done)return;done=true;clearTimeout(total);clearTimeout(again);clearNode();err?reject(err):resolve(value);}
  function retry(delay){if(done)return;clearNode();clearTimeout(again);again=setTimeout(check,delay);}
  function check(){
   if(done)return;cycles++;
   window[cb]=res=>{
    if(done)return;
    if(!res||res.status==='pending'){retry(Math.min(2500,650+cycles*140));return;}
    if(res.status!=='ready')finish(new Error('Balasan GAS tidak dikenali; update deployment ke Revisi 010.'));
    else if(res.ok)finish(null,res.result);
    else finish(new Error(res.error||'GAS menolak permintaan.'));
   };
   node=document.createElement('script');node.async=true;
   node.src=url+'?cbt_poll='+encodeURIComponent(id)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
   node.onerror=()=>retry(1400);
   watcher=setTimeout(()=>retry(1300),5500);
   document.head.appendChild(node);
  }

 });

async function callServer(name,...args){
 const url=urlBackend(),id=idPermintaan(),body=new URLSearchParams({cbt_bridge:'010',cbt_request_id:id,cbt_action:name,cbt_args:JSON.stringify(args)});
 const controller=new AbortController();
 try{void fetch(url,{method:'POST',mode:'no-cors',credentials:'omit',cache:'no-store',redirect:'follow',body,signal:controller.signal}).catch(()=>{});}
 catch(e){throw new Error('Tidak dapat mengirim data ke GAS. Periksa koneksi internet.');}
 const timeout=['mulaiUjian','akhiriUjian','ringkasanGuru','detailMuridGuru'].includes(name)?80000:65000;
 try{return await pollGAS(url,id,timeout);}finally{controller.abort();}
}
function ambilKonfigurasiAwal(){

  function end(err,value){if(done)return;done=true;clearTimeout(watchdog);script.remove();delete window[cb];err?reject(err):resolve(value);}
  window[cb]=d=>{
   if(!d||!d.ok||d.bridge!=='010'||!d.result){end(new Error('Versi GAS belum sesuai. Deploy Code.gs Revisi 010 sebagai New version.'));return;}
   end(null,d.result);
  };

  script.src=url+'?cbt_public='+id+'&callback='+cb+'&_='+Date.now();document.head.appendChild(script);
 });
}

 <div class="tp-grid" id="tpGrid">${tps.map(t=>{
  const score=t.nilai==null?'—':scoreFmt(t.nilai),below=t.nilai!=null&&t.nilai<state.public.kktp;
  return `<label class="tp-check"><input type="checkbox" value="${escapeHTML(t.kode)}" data-tp>
  <span class="tp-check-text"><strong>${escapeHTML(t.kode)}</strong><small>${escapeHTML(t.tujuan)}</small></span>
  <span class="tp-check-score" style="${below?'':'color:var(--muted)'}">${score}</span></label>`;
 }).join('')}</div><div class="mode-actions"><button id="startRemedial" class="button" type="button">Mulai Remedial (0 TP)</button>
 <button id="batalRemedial" class="button ghost" type="button">Batal</button></div></section>
 <div class="mode-actions"><button id="kembaliIdentitas" type="button" class="button ghost">← Ubah identitas</button></div>
 </main>`;
 el('mulaiUtama').onclick=()=>mulaiMode('UTAMA',[]);
 el('pilihRemedial').onclick=()=>{el('tpPicker').hidden=false;el('tpPicker').scrollIntoView({behavior:'smooth',block:'start'});};
 el('batalRemedial').onclick=()=>{el('tpPicker').hidden=true;};
 el('kembaliIdentitas').onclick=()=>{state.role='murid';loginPage();};
 el('tpGrid').onchange=()=>{state.tpPilihan=Array.from(document.querySelectorAll('[data-tp]:checked')).map(t=>t.value);
  el('startRemedial').textContent=`Mulai Remedial (${state.tpPilihan.length} TP)`;};
 el('startRemedial').onclick=()=>{if(!state.tpPilihan.length){notify('Centang minimal satu TP.');return;}mulaiMode('REMEDIAL',state.tpPilihan);};
 bindFullScreen();
}
async function mulaiMode(mode,tpDipilih){
 const button=mode==='UTAMA'?el('mulaiUtama'):el('startRemedial');
 if(button){button.disabled=true;button.textContent='Menyiapkan soal...';}
 try{const r=await callServer('mulaiUjian',{...state.draft,mode,tpDipilih});useResponse(r);}
 catch(e){showModePage(e.message);notify(e.message);}
}
function useResponse(response){
 if(!response||!response.tipe)throw new Error('Respons server tidak valid.');
 if(response.tipe==='selesai'){showResult(response.hasil);return;}
 if(response.tipe!=='ujian')throw new Error('Jenis respons tidak dikenal.');
 cleanup();const old=storageGet();state.session=response;state.token=response.token;
 state.answers={...(response.jawaban||{})};state.flags={};state.current=0;state.submitting=false;
 if(old&&old.token===response.token){Object.assign(state.answers,old.answers||{});state.flags=old.flags||{};state.current=Number.isInteger(old.current)?old.current:0;}
 state.current=Math.max(0,Math.min(response.pertanyaan.length-1,state.current));
 storageSet();showExam();window.scrollTo(0,0);
 state.tick=setInterval(updateTimer,1000);state.periodic=setInterval(()=>saveProgress(),45000);updateTimer();
}
function examCounts(){
 if(!state.session)return {total:0,answered:0,flagged:0,blank:0};
 const total=state.session.pertanyaan.length,answered=state.session.pertanyaan.filter(q=>state.answers[q.id]).length,
 flagged=state.session.pertanyaan.filter(q=>state.flags[q.id]).length;
 return {total,answered,flagged,blank:total-answered};
}
function showExam(){
 const s=state.session,type=s.mode==='REMEDIAL'?'Remedial':'Ujian Utama';
 app.innerHTML=`${nav()}<div class="wrap exam-layout"><main class="exam-main">
 <section class="card exam-banner"><div><div class="exam-name">${escapeHTML(s.nama)}</div>
 <div class="exam-meta">Kelas ${escapeHTML(s.kelas)}</div><span class="exam-type">${type}${s.mode==='REMEDIAL'?' • '+s.tpDipilih.length+' TP':''}</span></div>
 <div class="timer" id="timerBox"><div class="timer-label">Sisa waktu</div><div class="timer-digits" id="timerDigits" role="timer">--:--:--</div></div></section>
 <section class="card question-card"><div id="questionArea"></div><div class="question-footer">
 <button class="button secondary sm" id="flagButton" type="button">⚑ Tandai ragu</button>
 <div class="group-buttons"><button class="button ghost sm" id="prevButton" type="button">← Sebelumnya</button>
 <button class="button sm" id="nextButton" type="button">Berikutnya →</button></div></div></section></main>
 <aside class="card sidebar" id="examSidebar" aria-label="Navigasi Soal">
 <button type="button" class="sidebar-close" id="closeQuestionNav">✕ Tutup</button><h3 class="aside-title">Navigasi Soal</h3>
 <p class="aside-subtitle">Pilih nomor untuk berpindah soal.</p>
 <div class="aside-summary"><div class="mini-stat"><b id="countAnswered">0</b><span>Terjawab</span></div>
 <div class="mini-stat"><b id="countBlank">0</b><span>Belum</span></div><div class="mini-stat"><b id="countFlagged">0</b><span>Ragu-ragu</span></div></div>
 <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
 <div class="number-grid" id="numberGrid" style="margin-top:17px"></div>
 <div class="legend"><span><i class="dot answered"></i>Terjawab</span><span><i class="dot flagged"></i>Ragu-ragu</span><span><i class="dot blank"></i>Belum dijawab</span></div>
 <button class="button full" id="finishButton" type="button">Selesaikan Ujian</button>
 <p class="save-label" id="saveStatus" role="status">Jawaban disimpan otomatis</p></aside></div>
 <button class="sidebar-scrim" id="sidebarScrim" type="button" hidden></button>
 <div class="mobile-nav"><span class="mobile-nav-summary"><b id="mobileAnsweredCount">0</b> / ${s.pertanyaan.length} terjawab</span>
 <button class="button" id="openQuestionNav" type="button" aria-controls="examSidebar" aria-expanded="false">☷ Nomor Soal</button></div>
 <div class="bottom-note">Kumpulkan kapan saja sebelum 3 jam; jika waktu habis, ujian otomatis diselesaikan.</div>`;
 el('prevButton').onclick=()=>gotoQuestion(state.current-1);el('nextButton').onclick=()=>gotoQuestion(state.current+1);
 el('flagButton').onclick=toggleFlag;el('finishButton').onclick=openModal;
 el('openQuestionNav').onclick=openQuestionNav;el('closeQuestionNav').onclick=closeQuestionNav;el('sidebarScrim').onclick=closeQuestionNav;
 el('numberGrid').onclick=e=>{const target=e.target.closest('[data-index]');if(target){gotoQuestion(Number(target.dataset.index));closeQuestionNav();}};
 el('questionArea').onclick=e=>{const target=e.target.closest('[data-choice]');if(target)selectAnswer(target.dataset.choice);};
 renderQuestion();renderNumberGrid();refreshCounters();bindFullScreen();
}
function openQuestionNav(){const p=el('examSidebar');if(!p||innerWidth>940)return;p.classList.add('is-open');el('sidebarScrim').hidden=false;el('openQuestionNav').setAttribute('aria-expanded','true');document.body.classList.add('cbt-nav-open');el('closeQuestionNav').focus();}
function closeQuestionNav(){const p=el('examSidebar');if(!p)return;const was=p.classList.contains('is-open');p.classList.remove('is-open');el('sidebarScrim').hidden=true;document.body.classList.remove('cbt-nav-open');if(was){el('openQuestionNav').setAttribute('aria-expanded','false');el('openQuestionNav').focus();}}
function renderQuestion(){
 if(!state.session)return;const q=state.session.pertanyaan[state.current],ans=state.answers[q.id]||'',flagged=!!state.flags[q.id];
 el('questionArea').innerHTML=`<div class="q-top"><div class="q-title">Soal ${q.nomor} <span style="color:var(--muted);font-weight:500">/ ${state.session.pertanyaan.length}</span></div>
 <span class="q-chip">${escapeHTML(q.tp)}</span></div><p class="q-text">${escapeHTML(q.teks)}</p>
 ${q.diagram?renderDiagram(q):''}
 <div class="option-grid" role="group" aria-label="Pilihan jawaban">${q.opsi.map(o=>`<button type="button" class="option${ans===o.huruf?' selected':''}" data-choice="${escapeHTML(o.huruf)}" aria-pressed="${ans===o.huruf}">
 <span class="option-key">${escapeHTML(o.huruf)}</span><span class="option-text">${escapeHTML(o.teks)}</span></button>`).join('')}</div>`;
 el('flagButton').textContent=flagged?'✓ Hapus tanda ragu':'⚑ Tandai ragu';el('flagButton').className='button sm '+(flagged?'soft-red':'secondary');
 el('prevButton').disabled=state.current===0;el('nextButton').disabled=state.current===state.session.pertanyaan.length-1;
}
function renderNumberGrid(){if(!state.session)return;el('numberGrid').innerHTML=state.session.pertanyaan.map((q,i)=>{
 const classes=['number'];if(state.answers[q.id])classes.push('answered');if(state.flags[q.id])classes.push('flagged');if(i===state.current)classes.push('active');
 return `<button type="button" class="${classes.join(' ')}" data-index="${i}" aria-label="Soal ${i+1}" ${i===state.current?'aria-current="step"':''}>${i+1}</button>`;
}).join('');}
function refreshCounters(){if(!state.session)return;const c=examCounts();el('countAnswered').textContent=c.answered;el('countBlank').textContent=c.blank;el('countFlagged').textContent=c.flagged;el('mobileAnsweredCount').textContent=c.answered;el('progressFill').style.width=(100*c.answered/Math.max(c.total,1))+'%';}
function gotoQuestion(index){if(!state.session||state.submitting||index<0||index>=state.session.pertanyaan.length)return;state.current=index;renderQuestion();renderNumberGrid();storageSet();window.scrollTo({top:0,behavior:'smooth'});}
function selectAnswer(letter){if(!state.session||state.submitting||!['A','B','C','D'].includes(letter))return;const q=state.session.pertanyaan[state.current];state.answers[q.id]=letter;renderQuestion();renderNumberGrid();refreshCounters();storageSet();scheduleSave();}
function toggleFlag(){if(!state.session||state.submitting)return;const q=state.session.pertanyaan[state.current];if(state.flags[q.id])delete state.flags[q.id];else state.flags[q.id]=true;renderQuestion();renderNumberGrid();refreshCounters();storageSet();}
function scheduleSave(){clearTimeout(state.saveTimer);state.saveTimer=setTimeout(saveProgress,4000);showSaveStatus('Belum disinkronkan...',false);}
function showSaveStatus(text,error){const d=el('saveStatus');if(d){d.textContent=text;d.classList.toggle('error',!!error);}}
async function saveProgress(){
 if(!state.session||state.submitting)return;clearTimeout(state.saveTimer);
 if(state.saving){state.needSave=true;return;}state.saving=true;state.needSave=false;
 const snapshot={...state.answers};showSaveStatus('Menyimpan jawaban...',false);
 try{const r=await callServer('simpanProgres',state.token,snapshot);if(r.tipe==='selesai'){showResult(r.hasil);return;}
  if(JSON.stringify(snapshot)!==JSON.stringify(state.answers))state.needSave=true;
  showSaveStatus('✓ Jawaban tersimpan',false);
 }catch(e){if(state.session){state.needSave=true;showSaveStatus('Gagal menyimpan. Akan dicoba lagi.',true);}}
 finally{state.saving=false;if(state.needSave&&state.session&&!state.submitting){state.needSave=false;clearTimeout(state.saveTimer);state.saveTimer=setTimeout(saveProgress,4000);}}
}
function updateTimer(){
 if(!state.session||state.submitting)return;
 const left=Math.max(0,new Date(state.session.deadline).getTime()-Date.now()),sec=Math.ceil(left/1000),
 hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60),ss=sec%60;
 if(el('timerDigits'))el('timerDigits').textContent=[hh,mm,ss].map(x=>String(x).padStart(2,'0')).join(':');
 if(el('timerBox'))el('timerBox').classList.toggle('danger',left<=600000);
 if(left<=0)finishExam(true);
}
function openModal(){if(!state.session||state.submitting)return;closeQuestionNav();const c=examCounts();
 el('modalText').innerHTML=`Anda sudah menjawab <b>${c.answered} dari ${c.total} soal</b>. ${c.blank?`Masih ada <b>${c.blank} soal kosong</b>.`:'Semua soal telah dijawab.'}
 <br><br>Ujian ${state.session.mode==='REMEDIAL'?'Remedial':'Utama'} dapat diselesaikan sekarang tanpa menunggu waktu habis. Setelah dikumpulkan jawaban tidak dapat diedit.`;
 modal.hidden=false;el('modalConfirm').focus();}
function closeModal(){modal.hidden=true;}
async function finishExam(auto=false){
 if(!state.session||state.submitting)return;closeModal();state.submitting=true;clearTimeout(state.saveTimer);clearInterval(state.tick);clearInterval(state.periodic);
 const btn=el('finishButton');if(btn){btn.disabled=true;btn.textContent='Mengumpulkan...';}
 showSaveStatus(auto?'Waktu habis. Menyelesaikan ujian...':'Mengirim jawaban...',false);
 try{const r=await callServer('akhiriUjian',state.token,{...state.answers});if(r.tipe!=='selesai')throw new Error('Belum ada hasil final dari GAS.');showResult(r.hasil);}
 catch(e){state.submitting=false;if(btn){btn.disabled=false;btn.textContent='Coba Kumpulkan Lagi';}
  showSaveStatus('Gagal mengumpulkan. Periksa internet dan coba lagi.',true);notify(e.message);}
}
function localTime(s){const d=new Date(s);return Number.isNaN(d.getTime())?'-':d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function scoreFmt(n){return Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:2});}
function showResult(result){
 cleanup();closeModal();state.session=null;state.submitting=false;storageClear();state.token='';state.answers={};state.flags={};
 if(result&&result.nama&&result.kelas)state.draft={...state.draft,nama:result.nama,kelas:result.kelas};
 const visible=result&&typeof result.nilai==='number',name=escapeHTML(result.nama||'Murid'),mode=result.mode==='REMEDIAL'?'Remedial':'Ujian Utama';
 const scored=visible?`<section class="card result-card"><div class="score-layout">
 <div class="score-circle" style="--score:${Math.max(0,Math.min(100,result.nilai))}%"><div class="score-inner"><strong>${scoreFmt(result.nilai)}</strong><span>Nilai / 100</span></div></div>
 <div><div class="result-name">${name}</div><div class="result-meta">Kelas ${escapeHTML(result.kelas)} • ${mode}</div>
 <div style="margin-top:13px"><span class="pill ${result.remedial&&result.remedial.length?'orange':'green'}">${escapeHTML(result.status)}</span></div>
 <div class="score-metrics"><div class="score-metric"><b>${result.benar}</b><span>Benar</span></div>
 <div class="score-metric"><b>${result.dijawab}/${result.jumlahSoal}</b><span>Terjawab</span></div>
 <div class="score-metric"><b>${result.kktp}</b><span>KKTP per TP</span></div></div></div></div></section>
 <section class="card tp-panel"><div class="eyebrow">Pencapaian kompetensi • ${mode}</div><h2 style="font-size:21px">Hasil per Tujuan Pembelajaran</h2>
 <p class="sub">Setiap TP dinilai pada skala 0–100 berdasarkan bobot soal.</p>
 <div style="overflow-x:auto"><table class="tp-list"><thead><tr><th>TP</th><th>Tujuan Pembelajaran</th><th>Nilai</th><th>Status</th></tr></thead><tbody>
 ${(result.tps||[]).map(t=>`<tr><td class="tp-code">${escapeHTML(t.kode)}</td><td class="tp-goal">${escapeHTML(t.tujuan)}</td>
 <td><b>${scoreFmt(t.nilai)}</b></td><td><span class="pill ${t.tuntas?'green':'orange'}">${t.tuntas?'Tuntas':'Perlu remedial'}</span></td></tr>`).join('')}</tbody></table></div>
 ${result.mode==='REMEDIAL'?`<p class="help">Nilai Remedial hanya untuk TP yang diulang, tidak mengganti nilai Ujian Utama.</p>`:''}
 </section>`:
 `<div class="card result-card"><div class="result-name">${name}</div><p>${escapeHTML(result.keterangan||'Jawaban diterima.')}</p></div>`;
 app.innerHTML=`${nav()}<main class="wrap result"><div class="result-intro"><div class="checkmark">✓</div>
 <h1>${mode} telah diselesaikan</h1><p>Selesai: ${escapeHTML(localTime(result.selesai))}</p></div>${scored}
 <div class="result-footer"><button class="button secondary" id="printResult">Cetak / Simpan Hasil</button>
 <button class="button" id="backLogin">Kembali ke Beranda</button>
 <button class="button secondary" id="goRemedial">Pilih Remedial</button></div></main>`;
 el('printResult').onclick=()=>window.print();el('backLogin').onclick=()=>{state.role='murid';loginPage();};
 el('goRemedial').onclick=async()=>{
  if(!state.draft.nama)state.draft={nama:result.nama||'',kelas:result.kelas||'IX D',kodeAkses:''};
  app.innerHTML=`${nav()}<div class="loading"><div><div class="spinner"></div>Memuat pilihan TP...</div></div>`;
  bindFullScreen();
  try{state.profil=await callServer('profilMurid',state.draft);showModePage();el('pilihRemedial').click();}
  catch(e){loginPage(e.message);}
 };
 bindFullScreen();window.scrollTo(0,0);
}
/** Dashboard guru: akun per kelas, ringkasan mode, detail per TP dan riwayat. */
async function bukaDashboardGuru(){state.guruData=await callServer('ringkasanGuru',state.guruToken);renderDashboardGuru();}
function daftarAkunGabungan(){
 const result=new Map(),d=state.guruData||{daftar:[],akun:[]};
 function key(n,k){return String(k||'').toUpperCase()+'|'+String(n||'').trim().toLowerCase().replace(/\s+/g,' ');}
 (d.akun||[]).forEach(a=>{
  const id=key(a.nama,a.kelas);result.set(id,{nama:a.nama,kelas:a.kelas,status:a.status,utama:null,remedial:null,semua:[]});
 });
 (d.daftar||[]).slice().reverse().forEach(s=>{
  const id=key(s.nama,s.kelas);
  if(!result.has(id))result.set(id,{nama:s.nama,kelas:s.kelas,status:'AKTIF',utama:null,remedial:null,semua:[]});
  const x=result.get(id);x.semua.push(s);
  if(s.status==='SELESAI'){if(s.mode==='REMEDIAL')x.remedial=s;else x.utama=s;}
 });
 return Array.from(result.values()).sort((a,b)=>a.kelas.localeCompare(b.kelas)||a.nama.localeCompare(b.nama,'id'));
}
function renderDashboardGuru(){
 const d=state.guruData||{total:0,selesai:0,aktif:0,rataRata:null,daftar:[],akun:[]};
 const semua=daftarAkunGabungan(),count=(cls)=>semua.filter(a=>a.kelas===cls).length;
 app.innerHTML=`${nav()}<main class="wrap guru-dashboard">
 <div class="guru-heading"><div><div class="eyebrow">Panel Guru • ∑ π √</div><h2>Dashboard Hasil Matematika</h2>
 <p class="sub" style="margin-bottom:0">${escapeHTML(state.public.namaGuru||'Rima Fitriyani, M.Pd.')} • Pemantauan Ujian Utama dan Remedial per TP</p></div>
 <button class="button ghost" type="button" id="keluarGuru">Keluar Akun</button></div>
 <div class="guru-stats"><div class="card guru-stat"><span>Jumlah sesi</span><strong>${d.total}</strong></div>
 <div class="card guru-stat"><span>Ujian selesai</span><strong>${d.selesai}</strong></div>
 <div class="card guru-stat"><span>Murid IX D</span><strong>${count('IX D')}</strong></div>
 <div class="card guru-stat"><span>Murid IX E</span><strong>${count('IX E')}</strong></div></div>
 <section class="card guru-table-card"><div class="guru-toolbar"><div><h3>Hasil dan Akun Murid</h3>
 <p class="sub" style="margin:0">Perbandingan nilai utama dan remedial berdasarkan kelas.</p></div>
 <div class="guru-actions"><button class="button secondary sm" type="button" id="segarkanGuru">↻ Segarkan</button>
 <a class="button sm" href="${escapeHTML(d.spreadsheetUrl||'#')}" target="_blank" rel="noopener noreferrer">Buka Google Sheets</a></div></div>
 <div class="guru-filters"><label>Filter kelas<select id="filterKelas"><option value="SEMUA">Semua kelas</option>
 <option value="IX D" ${state.filterKelas==='IX D'?'selected':''}>IX D</option><option value="IX E" ${state.filterKelas==='IX E'?'selected':''}>IX E</option></select></label>
 <label>Jenis ujian<select id="filterMode"><option value="SEMUA">Semua jenis</option>
 <option value="UTAMA" ${state.filterMode==='UTAMA'?'selected':''}>Ujian Utama</option>
 <option value="REMEDIAL" ${state.filterMode==='REMEDIAL'?'selected':''}>Remedial</option></select></label></div>
 <div class="gurudata-scroll-tip">Geser tabel ke samping untuk melihat seluruh kolom →</div>
 <div class="table-scroll" role="region" tabindex="0" aria-label="Rekap dan akun murid">
 <table class="guru-table"><thead><tr><th>No.</th><th>Nama Murid</th><th>Kelas</th><th>Status Akun</th>
 <th>Ujian Utama</th><th>Remedial terbaru*</th><th>Jumlah sesi</th><th>Perbandingan TP</th><th>Akun Murid</th></tr></thead>
 <tbody id="guruRows"></tbody></table></div>
 <p class="help">*Nilai Remedial hanya untuk TP terpilih. Untuk membandingkan hasil secara tepat, gunakan tombol <b>Bandingkan TP</b> pada setiap murid.</p>
 <p class="help">Menu Hapus Akun menonaktifkan akses dan membatalkan ujian yang sedang aktif, tanpa menghapus arsip nilai di Google Sheets.</p>
 ${d.dibatasi?'<p class="help">Ringkasan sesi dibatasi 140 data terbaru. Riwayat lengkap per murid dapat dibuka melalui Bandingkan TP.</p>':''}
 </section></main>`;
 function populate(){
  const filtered=semua.filter(a=>(state.filterKelas==='SEMUA'||a.kelas===state.filterKelas)&&
    (state.filterMode==='SEMUA'||a.semua.some(s=>s.mode===state.filterMode)));
  el('guruRows').innerHTML=filtered.map((a,i)=>{
   const utama=a.utama&&a.utama.nilai!==null?scoreFmt(a.utama.nilai):'—';
   const rem=a.remedial&&a.remedial.nilai!==null?scoreFmt(a.remedial.nilai):'—';
   return `<tr><td>${i+1}</td><td><b>${escapeHTML(a.nama)}</b></td><td>${escapeHTML(a.kelas)}</td>
   <td><span class="pill ${a.status==='NONAKTIF'?'orange':'green'}">${a.status==='NONAKTIF'?'Nonaktif':'Aktif'}</span></td>
   <td><b>${utama}</b></td><td><b>${rem}</b></td><td>${a.semua.length}</td>
   <td><button type="button" class="button secondary sm" data-detail="${i}">Bandingkan TP</button></td>
   <td><button type="button" class="button ${a.status==='NONAKTIF'?'secondary':'soft-red'} sm" data-account="${i}">${a.status==='NONAKTIF'?'Aktifkan':'Hapus Akun'}</button></td></tr>`;
  }).join('')||'<tr><td colspan="9" class="empty-row">Belum ada akun pada filter ini.</td></tr>';
  // Indeks tombol mengikuti array hasil filter saat ini.
  el('guruRows').onclick=async ev=>{
   const det=ev.target.closest('[data-detail]'),act=ev.target.closest('[data-account]');
   if(det){const a=filtered[Number(det.dataset.detail)];if(a)await lihatPerbandingan(a);}
   if(act){const a=filtered[Number(act.dataset.account)];if(a)await gantiStatusAkun(a);}
  };
 }
 el('filterKelas').onchange=e=>{state.filterKelas=e.target.value;populate();};
 el('filterMode').onchange=e=>{state.filterMode=e.target.value;populate();};
 el('segarkanGuru').onclick=async()=>{el('segarkanGuru').disabled=true;try{await bukaDashboardGuru();}catch(e){notify(e.message);if(el('segarkanGuru'))el('segarkanGuru').disabled=false;}};
 el('keluarGuru').onclick=async()=>{const t=state.guruToken;state.guruToken='';guruStorageClear();state.role='guru';loginPage();try{await callServer('keluarGuru',t);}catch(e){}};
 populate();bindFullScreen();window.scrollTo(0,0);
}
async function lihatPerbandingan(murid){
 const loading=document.createElement('div');loading.className='toast';loading.textContent='Memuat detail nilai TP...';document.body.appendChild(loading);
 try{
  const d=await callServer('detailMuridGuru',state.guruToken,murid.nama,murid.kelas);
  if(el('detailOverlay'))el('detailOverlay').remove();
  const overlay=document.createElement('div');overlay.id='detailOverlay';overlay.className='modal';overlay.hidden=false;
  const rows=(d.perbandingan||[]).map(t=>{
   const diff=t.selisih==null?'—':`${t.selisih>0?'+':''}${scoreFmt(t.selisih)}`;
   return `<tr><td class="tp-code">${escapeHTML(t.kode)}</td><td class="tp-goal">${escapeHTML(t.tujuan)}</td>
   <td><b>${t.utama==null?'—':scoreFmt(t.utama)}</b></td><td><b>${t.remedial==null?'—':scoreFmt(t.remedial)}</b></td>
   <td class="${t.selisih==null?'':t.selisih>=0?'diff-plus':'diff-minus'}">${diff}</td></tr>`;
  }).join('');
  const history=(d.riwayat||[]).map(x=>`<tr><td>${escapeHTML(x.mode==='REMEDIAL'?'Remedial':'Utama')}</td>
   <td>${escapeHTML(localTime(x.selesai))}</td><td>${scoreFmt(x.nilai)}</td>
   <td style="white-space:normal;min-width:150px">${escapeHTML((x.tpDipilih||[]).join(', '))}</td></tr>`).join('');
  overlay.innerHTML=`<div class="modal-box detail-modal guru-detail"><div class="eyebrow">Perbandingan hasil per TP</div>
   <h2>${escapeHTML(d.nama)}</h2><p class="sub">Kelas ${escapeHTML(d.kelas)} • Nilai utama tetap utuh, remedial ditampilkan terpisah.</p>
   <div class="table-scroll"><table class="tp-list"><thead><tr><th>TP</th><th>Tujuan Pembelajaran</th><th>Ujian Utama</th><th>Remedial terakhir</th><th>Selisih</th></tr></thead>
   <tbody>${rows}</tbody></table></div><p class="help">Setiap TP dinilai pada skala 0–100 berdasarkan bobot soal.</p>
   <h3 style="margin:20px 0 8px">Riwayat Ujian</h3><div class="table-scroll"><table class="guru-table"><thead>
   <tr><th>Jenis</th><th>Selesai</th><th>Nilai</th><th>TP yang diuji</th></tr></thead>
   <tbody>${history||'<tr><td colspan="4">Belum ada hasil.</td></tr>'}</tbody></table></div>
   <div class="modal-actions"><button class="button" id="detailClose" type="button">Tutup</button></div></div>`;
  document.body.appendChild(overlay);const close=()=>overlay.remove();el('detailClose').onclick=close;
  overlay.onclick=e=>{if(e.target===overlay)close();};
 }catch(e){notify(e.message);}finally{loading.remove();}
}
async function gantiStatusAkun(murid){
 const isInactive=murid.status==='NONAKTIF';
 const text=isInactive?`Aktifkan kembali akun ${murid.nama} (${murid.kelas})?`:
 `Hapus/nonaktifkan akun ${murid.nama} (${murid.kelas})?\n\nSesi yang masih aktif akan dibatalkan. Riwayat nilai dan rekap tetap tersimpan.`;
 if(!window.confirm(text))return;
 const action=isInactive?'aktifkanAkunMurid':'hapusAkunMurid';
 try{const out=await callServer(action,state.guruToken,murid.nama,murid.kelas);
  notify(isInactive?'Akun murid diaktifkan kembali.':(out.pesan||'Akun murid dinonaktifkan.'));
  await bukaDashboardGuru();
 }catch(e){notify(e.message);}
}

async function boot(){
 try{state.public=await ambilKonfigurasiAwal();}
 catch(e){state.role='murid';loginPage(e.message);return;}
 const teacher=guruStorageGet();
 if(teacher&&teacher.token){state.role='guru';state.guruToken=teacher.token;state.guruName=teacher.nama||'guru';
  try{await bukaDashboardGuru();return;}catch(e){guruStorageClear();state.guruToken='';state.role='murid';}}
 const old=storageGet();
 if(old&&old.token){
  try{useResponse(await callServer('ambilUjian',old.token));return;}
  catch(e){storageClear();loginPage('Sesi sebelumnya tidak dapat dipulihkan: '+e.message);return;}
 }
 loginPage();
}
el('modalCancel').addEventListener('click',closeModal);
el('modalConfirm').addEventListener('click',()=>finishExam(false));
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!modal.hidden){closeModal();return;}
 if(e.key==='Escape'&&el('detailOverlay')){el('detailOverlay').remove();return;}
 if(e.key==='Escape'&&el('examSidebar')&&el('examSidebar').classList.contains('is-open')){closeQuestionNav();return;}
 if(!state.session||state.submitting||!modal.hidden)return;
 if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement&&document.activeElement.tagName))return;
 if(['1','2','3','4'].includes(e.key))selectAnswer(['A','B','C','D'][Number(e.key)-1]);
 else if(e.key==='ArrowLeft'){e.preventDefault();gotoQuestion(state.current-1);}
 else if(e.key==='ArrowRight'){e.preventDefault();gotoQuestion(state.current+1);}
 else if(e.key.toLowerCase()==='r')toggleFlag();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&state.session){storageSet();saveProgress();}});
window.addEventListener('beforeunload',()=>{if(state.session)storageSet();});
boot();
